name: Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot
        shell: bash
        run: |
          GODOT_VERSION="4.4.1"
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import project
        run: '"$GODOT_BIN" --headless --editor --path . --quit'
      - name: Record gameplay preview (virtual display)
        shell: bash
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          "$GODOT_BIN" --path . --rendering-method gl_compatibility --resolution 1280x720 > /tmp/dust-dinosaurs-game.log 2>&1 &
          GAME_PID=$!
          # Wait for the actual game window and give the 3D scene time to finish building.
          for n in $(seq 1 30); do
            WINDOW_ID=$(xdotool search --onlyvisible --name '.*' 2>/dev/null | tail -n 1 || true)
            [ -n "$WINDOW_ID" ] && break
            sleep 1
          done
          sleep 5
          if [ -n "$WINDOW_ID" ]; then
            xdotool windowactivate --sync "$WINDOW_ID" || true
            xdotool windowfocus --sync "$WINDOW_ID" || true
            xdotool mousemove --sync 640 360
            xdotool click 1
          fi
          ffmpeg -y -f x11grab -video_size 1280x720 -framerate 30 -i :99.0 -t 32 -pix_fmt yuv420p build-preview.mp4 >/tmp/ffmpeg-preview.log 2>&1 &
          REC_PID=$!
          sleep 1
          # Walk out from the spawn point toward the main street and town.
          xdotool keydown w
          sleep 5
          xdotool keyup w
          # Turn the camera left, inspect the street, then sweep right across the town.
          xdotool mousemove_relative -- 520 0
          sleep 2
          xdotool mousemove_relative -- 0 140
          sleep 2
          xdotool mousemove_relative -- -980 -110
          sleep 3
          xdotool keydown w
          xdotool keydown shift
          sleep 3
          xdotool keyup w
          xdotool keyup shift
          xdotool mousemove_relative -- 460 0
          sleep 2
          xdotool key space
          sleep 2
          xdotool key e
          sleep 2
          xdotool mousemove_relative -- -250 0
          sleep 2
          xdotool keydown s
          sleep 2
          xdotool keyup s
          wait $REC_PID || true
          kill $GAME_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          test -s build-preview.mp4
      - name: Export Windows executable
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" "build/DUST & DINOSAURS.exe"
      - name: Upload gameplay preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DUST-DINOSAURS-Gameplay-Preview
          path: build-preview.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: DUST-DINOSAURS-Windows
          path: |
            build/DUST & DINOSAURS.exe
            build/DUST & DINOSAURS.pck
          if-no-files-found: error
          retention-days: 30
