name: Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot
        shell: bash
        run: |
          GODOT_VERSION="4.4.1"
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Validate project scripts
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            echo "Godot script validation failed"
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --script tests/test_preview_route.gd
      - name: Record gameplay preview (virtual display)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool x11-utils
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          GAME_PID=""
          REC_PID=""
          cleanup() {
            [ -n "$REC_PID" ] && kill "$REC_PID" 2>/dev/null || true
            [ -n "$GAME_PID" ] && kill "$GAME_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          "$GODOT_BIN" --path . --rendering-method forward_plus --audio-driver Dummy --resolution 1280x720 --position 0,0 -- --preview > game-runtime.log 2>&1 &
          GAME_PID=$!
          READY=0
          # The game emits this marker only after the scene, HUD, and camera route are built.
          for n in $(seq 1 60); do
            if grep -Fq "PREVIEW_READY" game-runtime.log; then
              READY=1
              break
            fi
            if ! kill -0 "$GAME_PID" 2>/dev/null; then
              cat game-runtime.log
              echo "Godot exited before the gameplay scene became ready"
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat game-runtime.log
            xwininfo -root -tree || true
            echo "Gameplay preview readiness marker was not emitted"
            exit 1
          fi
          WINDOW_ID=$(xdotool search --name "DUST" 2>/dev/null | head -n 1 || true)
          if [ -z "$WINDOW_ID" ]; then
            cat game-runtime.log
            xwininfo -root -tree || true
            echo "Gameplay window was not found after the ready marker"
            exit 1
          fi
          WINDOW_TITLE=$(xdotool getwindowname "$WINDOW_ID")
          echo "Gameplay scene ready in window: $WINDOW_TITLE"
          xdotool windowmap "$WINDOW_ID"
          xdotool windowraise "$WINDOW_ID" || true
          # Allow the first fully rendered gameplay frame to settle before recording.
          sleep 2
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" game-runtime.log; then
            cat game-runtime.log
            echo "Runtime errors detected; refusing to record a fake gameplay video"
            exit 1
          fi
          # The in-game --preview route drives a deterministic camera path; no fake input is injected.
          ffmpeg -y -f x11grab -video_size 1280x720 -framerate 30 -i :99.0 -t 42 -pix_fmt yuv420p build-preview.mp4 >/tmp/ffmpeg-preview.log 2>&1 &
          REC_PID=$!
          wait "$REC_PID"
          REC_PID=""
          kill "$GAME_PID" 2>/dev/null || true
          GAME_PID=""
          test -s build-preview.mp4
          SIZE=$(stat -c%s build-preview.mp4)
          echo "Gameplay video size: $SIZE bytes"
          [ "$SIZE" -gt 100000 ]
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build-preview.mp4)
          echo "Gameplay preview duration: $DURATION seconds"
          awk -v duration="$DURATION" 'BEGIN { exit !(duration >= 41.0) }'
          ffmpeg -y -ss 16 -i build-preview.mp4 -frames:v 1 preview-start.png >/dev/null 2>&1
          ffmpeg -y -ss 32 -i build-preview.mp4 -frames:v 1 preview-end.png >/dev/null 2>&1
          if cmp -s preview-start.png preview-end.png; then
            echo "Automated preview camera did not visibly move"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" game-runtime.log; then
            cat game-runtime.log
            echo "Runtime errors detected during gameplay preview"
            exit 1
          fi
      - name: Export Windows executable
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" "build/DUST & DINOSAURS.exe"
      - name: Upload gameplay preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DUST-DINOSAURS-Gameplay-Preview
          path: build-preview.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: DUST-DINOSAURS-Windows
          path: |
            build/DUST & DINOSAURS.exe
            build/DUST & DINOSAURS.pck
          if-no-files-found: error
          retention-days: 30
