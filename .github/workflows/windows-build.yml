name: Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot
        shell: bash
        run: |
          GODOT_VERSION="4.4.1"
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          curl -L "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Validate project scripts
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            echo "Godot script validation failed"
            exit 1
          fi
      - name: Record gameplay preview (virtual display)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool x11-utils
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          GAME_PID=""
          REC_PID=""
          cleanup() {
            [ -n "$REC_PID" ] && kill "$REC_PID" 2>/dev/null || true
            [ -n "$GAME_PID" ] && kill "$GAME_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          "$GODOT_BIN" --path . --rendering-method gl_compatibility --resolution 1280x720 --position 0,0 > game-runtime.log 2>&1 &
          GAME_PID=$!
          WINDOW_ID=""
          for n in $(seq 1 40); do
            WINDOW_ID=$(xdotool search --name "DUST" 2>/dev/null | head -n 1 || true)
            if [ -n "$WINDOW_ID" ]; then break; fi
            if ! kill -0 "$GAME_PID" 2>/dev/null; then
              cat game-runtime.log
              echo "Godot exited before creating a game window"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$WINDOW_ID" ]; then
            cat game-runtime.log
            xwininfo -root -tree || true
            echo "Could not find the Godot game window"
            exit 1
          fi
          xdotool windowmap "$WINDOW_ID"
          xdotool windowfocus "$WINDOW_ID" || true
          xdotool windowraise "$WINDOW_ID" || true
          sleep 8
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" game-runtime.log; then
            cat game-runtime.log
            echo "Runtime errors detected; refusing to record a fake gameplay video"
            exit 1
          fi
          # Start recording only after the scene is loaded and the game window is focused.
          ffmpeg -y -f x11grab -video_size 1280x720 -framerate 30 -i :99.0 -t 38 -pix_fmt yuv420p build-preview.mp4 >/tmp/ffmpeg-preview.log 2>&1 &
          REC_PID=$!
          sleep 2
          # Walk forward into Red Rock, then perform a broad horizontal camera sweep.
          xdotool keydown w
          sleep 5
          xdotool keyup w
          xdotool mousemove 980 360
          sleep 2
          xdotool mousemove 300 360
          sleep 2
          xdotool mousemove 640 360
          sleep 2
          # Walk diagonally through the street while looking across the buildings.
          xdotool keydown w
          xdotool keydown d
          sleep 3
          xdotool keyup w
          xdotool keyup d
          xdotool mousemove 850 300
          sleep 2
          xdotool mousemove 420 420
          sleep 2
          # Sprint, jump, interact, and turn back toward the town.
          xdotool keydown shift
          xdotool keydown w
          sleep 3
          xdotool keyup w
          xdotool keyup shift
          xdotool key space
          sleep 2
          xdotool key e
          sleep 2
          xdotool mousemove 700 360
          sleep 2
          xdotool keydown s
          sleep 2
          xdotool keyup s
          wait "$REC_PID"
          REC_PID=""
          kill "$GAME_PID" 2>/dev/null || true
          GAME_PID=""
          test -s build-preview.mp4
          SIZE=$(stat -c%s build-preview.mp4)
          echo "Gameplay video size: $SIZE bytes"
          [ "$SIZE" -gt 100000 ]
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build-preview.mp4
      - name: Export Windows executable
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" "build/DUST & DINOSAURS.exe"
      - name: Upload gameplay preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DUST-DINOSAURS-Gameplay-Preview
          path: build-preview.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: DUST-DINOSAURS-Windows
          path: |
            build/DUST & DINOSAURS.exe
            build/DUST & DINOSAURS.pck
          if-no-files-found: error
          retention-days: 30
