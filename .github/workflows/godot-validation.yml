name: Godot validation and Windows export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR branch supersedes the previous full validation run.
# This keeps a multi-commit anatomy pass from occupying runners with stale snapshots.
concurrency:
  group: godot-validation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project and parse scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Test continuous triceratops torso anatomy
        run: timeout 30s godot --headless --path . --script tests/test_triceratops_body.gd

      - name: Test continuous triceratops legs and terrain contact
        run: timeout 30s godot --headless --path . --script tests/test_triceratops_legs.gd

      - name: Test continuous triceratops head, jaw and eye sockets
        run: timeout 30s godot --headless --path . --script tests/test_triceratops_head.gd

      - name: Test coordinated triceratops diagonal gait
        run: timeout 30s godot --headless --path . --script tests/test_triceratops_gait.gd

      - name: Test closed triceratops frill geometry
        run: timeout 30s godot --headless --path . --script tests/test_triceratops_frill.gd

      - name: Test sandstone rock LOD and collision
        run: godot --headless --path . --script tests/test_rock_lod.gd

      - name: Test deterministic roof shingle geometry
        run: godot --headless --path . --script tests/test_roof_shingles.gd
      - name: Test layered frontier wood grain and weathering
        run: godot --headless --path . --script tests/test_frontier_wood_material.gd

      - name: Test stratified sandstone outcrop geometry and LOD
        run: timeout 30s godot --headless --path . --script tests/test_rock_formation.gd

      - name: Test walkable frontier building interiors
        run: timeout 30s godot --headless --path . --script tests/test_building_interiors.gd

      - name: Test desert terrain relief and arroyo profile
        run: godot --headless --path . --script tests/test_terrain_relief.gd
      - name: Test layered Arizona soil material response
        run: godot --headless --path . --script tests/test_terrain_material.gd

      - name: Test faceted desert pebble geometry and placement
        run: timeout 30s godot --headless --path . --script tests/test_desert_pebbles.gd
      - name: Test warm desert aerial perspective and sunset shadows
        run: godot --headless --path . --script tests/test_atmosphere_depth.gd
      - name: Test deterministic creosote bush geometry and scatter
        run: godot --headless --path . --script tests/test_creosote_bushes.gd

      - name: Test curved desert grass geometry and per-instance wind
        run: timeout 30s godot --headless --path . --script tests/test_desert_tufts.gd
      - name: Test procedural saguaro ribs and spine detail
        run: godot --headless --path . --script tests/test_saguaro_detail.gd

      - name: Test continuous tyrannosaur body anatomy
        run: godot --headless --path . --script tests/test_tyrannosaur_anatomy.gd

      - name: Test continuous tyrannosaur legs and feet
        run: godot --headless --path . --script tests/test_tyrannosaur_legs.gd

      - name: Test continuous tapered dinosaur tails
        run: godot --headless --path . --script tests/test_dinosaur_tail.gd

      - name: Test procedural dinosaur skin materials
        run: godot --headless --path . --script tests/test_dinosaur_skin.gd

      - name: Test preview route landmark framing
        run: godot --headless --path . --script tests/test_preview_route.gd

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 8

      - name: Export Windows x86_64 executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/DUST & DINOSAURS.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DUST-DINOSAURS-Windows
          path: build/DUST & DINOSAURS.exe
          if-no-files-found: error
          retention-days: 14
