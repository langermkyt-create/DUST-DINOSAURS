name: Godot validation and Windows export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 8

      - name: Export Windows x86_64 executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/DUST & DINOSAURS.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DUST-DINOSAURS-Windows
          path: build/DUST & DINOSAURS.exe
          if-no-files-found: error
          retention-days: 14
